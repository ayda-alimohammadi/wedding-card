    <div class="top">
      <div class="background"></div>
      <div class="fade"></div>
      <div class="content">
        <div class="names"><p>علی و نگار</p></div>
        <div class="invitation">
          <p>تا باد چنین بادا</p>
          <p>معشوق به سامان شد</p>
          
        </div>
        <div class="date-card">
          <div class="row">
            <div class="year">1404</div>
            <div class="month">مهر</div>
            <span class="day-number">25</span>
          </div>
        </div>
        <p class="invante">با شادی و عشق فراوان، شما را به جشن ازدواجمان دعوت می‌کنیم </p>
        <div class="icons-row">
          <div class="icon-box">
            <a href="https://nshn.ir/dc_bfWxZp5tJ_m" target="_blank">
              <i class="fa-solid fa-location-dot"></i>
            </a>
          </div>
          <div class="icon-box">
            <a href="#timeline">
              <i class="fa-solid fa-clock"></i>
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>  
  <div id="timeline" class="timeline">
    <div class="start-circle"></div>
    <div class="event left">
      <span class="time">16:00</span>
      <i class="fa-solid fa-church"></i>
      <p>ورود و خوشامدگویی</p>
    </div>

    <div class="event right">
      <span class="time">16:30</span>
      <i class="fa-solid fa-ring"></i>
      <p>مراسم عقد</p>
    </div>

    <div class="event left">
      <span class="time">17:30</span>
      <i class="fa-solid fa-camera"></i>
      <p>عکس یادگاری</p>
    </div>

    <div class="event right">
      <span class="time">18:00</span>
      <i class="fas fa-glass-cheers"></i>
      <p>رقص و جشن</p>
    </div>

    <div class="event left">
      <span class="time">20:30</span>
      <i class="fa-solid fa-cake-candles"></i>
      <p> برش کیک  </p>
    </div>
    <div class="event right">
      <span class="time">21:00</span>
      <i class="fa-solid fa-hand"></i>
      <p> حنابندان </p>
    </div>
    <div class="event left">
      <span class="time">22:00</span>
      <i class="fa-solid fa-utensils"></i>
      <p> سرو شام </p>
    </div>
    <div class="event right">
      <span class="time">23:00</span>
      <i class="fa-solid fa-car"></i>
      <p> پایان مراسم </p>
    </div>
    <div class="end-circle"></div>
  </div>
